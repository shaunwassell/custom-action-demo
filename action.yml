name: custom-action-demo

description: A simple demo for creating custom actions

inputs:
  name-of-workflow:
    description: The name of the workflow calling the action
    required: true
  name-of-job:
    description: The name of the job calling the action
    required: false
    default: "<job not specified>"

outputs:
  message:
    description: A friendly message from the action
    value: ${{ steps.create-message.outputs.message }}

runs:
  using: composite

  steps:
    - name: Print message
      shell: bash
      env:
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
      run: echo "A custom action has been called by $WORKFLOW_NAME"

    - name: Set output
      id: create-message
      shell: bash
      run: echo "message=Hello from inside a workflow!" >> "$GITHUB_OUTPUT"

    - name: Say goodbye
      shell: bash
      run: echo "Goodbye..."